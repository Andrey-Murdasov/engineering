<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Управление портфолио — Андрей Мурдасов</title>
  <link rel="icon" href="img/favicon.png" type="image/png">
  <link rel="stylesheet" href="css/bootstrap.min.css">
  <link rel="stylesheet" href="css/style.css">
  <style>
    body { padding-top: 25px; background: #eaeaea; }
    .admin-box { max-width: 560px; margin: 0 auto 40px auto; background: #fff; border: 3px solid #111; box-shadow: 8px 8px 0 #111; padding: 24px; }
    .gate-box { padding: 14px; border: 3px solid #111; margin-bottom: 22px; }
    .gate-closed { background: #ffebee; }
    .gate-open { background: #e8f5e9; }
    .status-msg { margin-top: 15px; font-weight: 700; padding: 12px; border: 2px solid #111; display: none; }
    .status-ok { background: #47ed84; display: block; }
    .status-err { background: #ff8a80; display: block; }
    .status-load { background: #fff59d; display: block; }
    label { font-weight: 800; display: block; margin-bottom: 6px; font-size: 14px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="admin-box">
      <h2 style="margin-bottom: 5px;">📸 Управление портфолио</h2>
      <p style="font-size: 14px; color: #555; margin-bottom: 18px;">Добавление, перенос, скрытие и удаление объектов с ПК или телефона.</p>

      <div id="gate-box" class="gate-box gate-closed">
        <div id="gate-closed-view">
          <div style="font-weight: 800; color: #b71c1c; margin-bottom: 8px;">🔒 Калитка закрыта — введите GitHub Token</div>
          <input type="text" id="gh-token" autocomplete="off" class="retro-input" style="margin-bottom: 10px;" placeholder="github_pat_xxxxxxxxxxxx">
          <button type="button" id="login-btn" class="retro-btn" style="background: #111; color: #fff; width: 100%;">
            🔑 Открыть доступ и проверить токен
          </button>
        </div>

        <div id="gate-open-view" style="display: none; justify-content: space-between; align-items: center; gap: 10px;">
          <div style="font-weight: 800; color: #1b5e20;">🟢 Калитка открыта! Вы в системе</div>
          <button type="button" id="logout-btn" style="background: #fff; border: 2px solid #111; padding: 4px 10px; font-size: 12px; font-weight: 700; cursor: pointer;">
            Выйти / сменить
          </button>
        </div>
      </div>

      <form id="project-form">
        <label>1. Раздел сайта:</label>
        <select id="p-category" class="retro-input" required>
          <option value="obmer">📐 Обмер помещений</option>
          <option value="electrika">⚡ Проектирование электрики (ЭОМ)</option>
          <option value="avtonomka">🔋 Автономное и резервное питание</option>
          <option value="remont">🦺 Ремонт под ключ</option>
        </select>

        <label>2. Название объекта / проекта:</label>
        <input type="text" id="p-title" class="retro-input" required placeholder="Например: ЖК Каравелла Португалии, 65 м²">

        <label>3. Локация (необязательно):</label>
        <input type="text" id="p-location" class="retro-input" placeholder="Например: Сочи, Центральный район">

        <label>4. Описание выполненных работ:</label>
        <textarea id="p-desc" rows="3" class="retro-input" placeholder="Кратко: что сделано, сроки, особенности..."></textarea>

        <label>5. Фотографии (можно выбрать несколько):</label>
        <input type="file" id="p-photos" accept="image/*" multiple class="retro-input" style="padding: 8px; margin-bottom: 10px;">
        <div id="photo-queue" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 10px; margin-bottom: 18px;"></div>

        <label>🛡️ Режим водяного знака на новых фото:</label>
        <select id="p-watermark" class="retro-input">
          <option value="grid" selected>1. Диагональная сетка по всему фото</option>
          <option value="center">2. Крупная полупрозрачная подпись по центру</option>
          <option value="stickers">3. Хаотичные белые плашки (4 шт.)</option>
          <option value="none">4. Без водяного знака (чистое фото)</option>
        </select>

        <label>6. Ссылка на видеообзор (необязательно):</label>
        <input type="text" id="p-video" class="retro-input" placeholder="Ссылка на YouTube, RuTube или VK Видео">

        <button type="submit" id="submit-btn" class="retro-btn" style="background: #db5323; color: #fff; width: 100%; font-size: 16px; padding: 14px;">
          🚀 Опубликовать проект на сайте
        </button>
          <button type="button" id="cancel-edit-btn" onclick="cancelEdit()" class="retro-btn" style="display: none; background: #e0e0e0; color: #111; width: 100%; font-size: 14px; padding: 10px; margin-top: 10px;">
          ❌ Отменить редактирование (вернуться к созданию нового)
        </button>

      </form>

      <div id="status" class="status-msg"></div>

      <hr style="margin: 28px 0; border-top: 2px dashed #333;">
      <h3 style="font-size: 18px; margin-bottom: 12px;">📋 Загруженные проекты (перенос / скрытие / удаление)</h3>
      <div id="manage-list" style="display: flex; flex-direction: column; gap: 10px;">
        <small style="color: #666;">Загрузка списка...</small>
      </div>

      <div style="margin-top: 25px; text-align: center;">
        <a href="index.html" style="font-weight: 700; color: #111;">← Вернуться на главную</a>
      </div>
    </div>
  </div>

  <script src="js/watermark.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
