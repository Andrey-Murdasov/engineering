<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Добавить проект на сайт</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="img/favicon.png" type="image/png">

  <style>
    body { padding-top: 25px; background: #eaeaea; }
    .admin-box { max-width: 540px; margin: 0 auto 40px auto; background: #fff; border: 3px solid #111; box-shadow: 8px 8px 0 #111; padding: 24px; }
    .status-msg { margin-top: 15px; font-weight: 700; padding: 12px; border: 2px solid #111; display: none; }
    .status-ok { background: #47ed84; display: block; }
    .status-err { background: #ff8a80; display: block; }
    .status-load { background: #fff59d; display: block; }
    label { font-weight: 800; display: block; margin-bottom: 6px; font-size: 14px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="admin-box">
      <h2 style="margin-bottom: 5px;">📸 Новый проект в портфолио</h2>
      <p style="font-size: 14px; color: #555; margin-bottom: 20px;">Заполните поля и выберите фото с телефона — они сами сожмутся и появятся на сайте.</p>

      <div id="token-block" style="background: #f5f5f5; padding: 12px; border: 2px dashed #333; margin-bottom: 20px;">
        <label>🔑 GitHub Token (вводится 1 раз на телефоне):</label>
        <input type="password" id="gh-token" class="retro-input" style="margin-bottom: 5px;" placeholder="ghp_xxxxxxxxxxxx">
        <small style="color: #666;">Сохраняется только в браузере вашего телефона.</small>
      </div>

      <form id="project-form">
        <label>1. Раздел сайта:</label>
        <select id="p-category" class="retro-input" required>
          <option value="obmer">📐 Обмер помещений</option>
          <option value="electrika">⚡ Проектирование электрики (ЭОМ)</option>
          <option value="avtonomka">🔋 Автономное и резервное питание</option>
          <option value="remont">🦺 Ремонт под ключ</option>
        </select>

        <label>2. Название объекта / проекта:</label>
        <input type="text" id="p-title" class="retro-input" required placeholder="Например: ЖК Каравелла Португалии, 65 м²">

        <label>3. Локация (необязательно):</label>
        <input type="text" id="p-location" class="retro-input" placeholder="Например: Сочи, Центральный район">

        <label>4. Описание выполненных работ:</label>
        <textarea id="p-desc" rows="3" class="retro-input" placeholder="Кратко: что сделано, сроки, особенности..."></textarea>

        <label>5. Фотографии (можно выбрать несколько):</label>
        <input type="file" id="p-photos" accept="image/*" multiple required class="retro-input" style="padding: 8px;">

        <button type="submit" id="submit-btn" class="retro-btn" style="background: #db5323; color: #fff; width: 100%; font-size: 16px; padding: 14px;">
          🚀 Опубликовать проект на сайте
        </button>
      </form>

      <div id="status" class="status-msg"></div>
      <div style="margin-top: 20px; text-align: center;">
        <a href="index.html" style="font-weight: 700; color: #111;">← Вернуться на главную</a>
      </div>
    </div>
  </div>

  <script>
    const OWNER = "Andrey-Murdasov";
    const REPO = "engineering"; // Имя нового репозитория

    const tokenInput = document.getElementById("gh-token");
    const savedToken = localStorage.getItem("gh_portfolio_token");
    if (savedToken) {
      tokenInput.value = savedToken;
      document.getElementById("token-block").style.display = "none";
    }

    function showStatus(text, type) {
      const el = document.getElementById("status");
      el.textContent = text;
      el.className = "status-msg " + type;
    }

    // Сжатие фото прямо в браузере телефона перед отправкой
    function compressImage(file, maxWidth = 1200, quality = 0.75) {
      return new Promise((resolve) => {
        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement("canvas");
            let w = img.width, h = img.height;
            if (w > maxWidth) { h = Math.round((h * maxWidth) / w); w = maxWidth; }
            canvas.width = w; canvas.height = h;
            canvas.getContext("2d").drawImage(img, 0, 0, w, h);
            const dataUrl = canvas.toDataURL("image/jpeg", quality);
            resolve(dataUrl.split(",")[1]);
          };
          img.src = e.target.result;
        };
        reader.readAsDataURL(file);
      });
    }

    async function ghApi(path, method = "GET", body = null, token) {
      const res=await fetch(`https://api.github.com/repos/Andrey-Murdasov/engineering/contents/${path}`,{
        method,
        headers: {
          "Authorization": `Bearer ${token}`,
          "Accept": "application/vnd.github+json",
          "Content-Type": "application/json"
        },
        body: body ? JSON.stringify(body) : null
      });
      if (!res.ok) throw new Error(`Ошибка GitHub (${res.status}): проверьте токен или имя репозитория`);
      return res.json();
    }

    document.getElementById("project-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const token = tokenInput.value.trim();
      if (!token) return showStatus("Введите GitHub Token!", "status-err");
      localStorage.setItem("gh_portfolio_token", token);

      const files = document.getElementById("p-photos").files;
      if (!files.length) return showStatus("Выберите хотя бы одно фото!", "status-err");

      const btn = document.getElementById("submit-btn");
      btn.disabled = true;

      try {
        const uploadedPaths = [];
        const timestamp = Date.now();

        for (let i = 0; i < files.length; i++) {
          showStatus(`⏳ Сжимаю и загружаю фото ${i + 1} из ${files.length}...`, "status-load");
          const base64Content = await compressImage(files[i]);
          const fileName = `img/projects/${timestamp}_${i + 1}.jpg`;
          await ghApi(fileName, "PUT", {
            message: `Add project photo ${timestamp}_${i + 1}`,
            content: base64Content
          }, token);
          uploadedPaths.push(fileName);
        }

        showStatus("⏳ Обновляю ленту проектов на сайте...", "status-load");
        let projects = [];
        let sha = null;
        try {
          const existing = await ghApi("projects.json", "GET", null, token);
          sha = existing.sha;
          const decoded = decodeURIComponent(escape(atob(existing.content)));
          projects = JSON.parse(decoded);
        } catch (err) {
          projects = []; // Если файла еще нет, создадим новый
        }

        // Добавляем новый проект в самое начало списка
        projects.unshift({
          category: document.getElementById("p-category").value,
          title: document.getElementById("p-title").value.trim(),
          location: document.getElementById("p-location").value.trim(),
          description: document.getElementById("p-desc").value.trim(),
          images: uploadedPaths,
          date: new Date().toLocaleDateString("ru-RU")
        });

        const updatedBase64 = btoa(unescape(encodeURIComponent(JSON.stringify(projects, null, 2))));
        const putBody = { message: "Add new project via mobile form", content: updatedBase64 };
        if (sha) putBody.sha = sha;

        await ghApi("projects.json", "PUT", putBody, token);

        showStatus("✅ Готово! Проект опубликован и появится на сайте через 30–60 секунд.", "status-ok");
        document.getElementById("project-form").reset();
      } catch (err) {
        showStatus("❌ " + err.message, "status-err");
      } finally {
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
